<!DOCTYPE html>

    <title>Test Dashboard Locally</title>
</head>
<body>
    <h1>Test Dashboard Locally</h1>
    <p>To test the dashboard locally:</p>
    <ol>
        <li>Open a terminal in the project root</li>
        <li>Run: <code>cd docs && python3 -m http.server 8000</code></li>
        <li>Open: <a href="http://localhost:8000">http://localhost:8000</a></li>
    </ol>
    <p>The dashboard will load and display the current status from status.json</p>
</body>
</html>
