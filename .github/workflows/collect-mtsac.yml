name: Collect Mt SAC Schedule

on:
  workflow_dispatch:
    inputs:
      term_code:
        description: 'Term code to collect (e.g., 202520 for Fall 2025)'
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: yezz123/setup-uv@v4
      with:
        uv-version: "0.5.16"
    
    - name: Create Mt SAC data directory
      run: mkdir -p data/mtsac
    
    - name: Collect Mt SAC schedule data
      run: |
        chmod +x collect.py
        if [ "${{ github.event.inputs.term_code }}" != "" ]; then
          echo "Collecting specific term: ${{ github.event.inputs.term_code }}"
          uv run collect.py --college mtsac --term-code "${{ github.event.inputs.term_code }}"
        else
          echo "Collecting current term schedule for Mt SAC"
          uv run collect.py --college mtsac
        fi
      timeout-minutes: 15
    
    - name: Validate collected data
      run: |
        chmod +x cli.py
        LATEST_FILE=$(ls data/mtsac/schedule_*_latest.json 2>/dev/null | head -1)
        if [ -f "$LATEST_FILE" ]; then
          echo "Validating $LATEST_FILE"
          uv run cli.py validate "$LATEST_FILE"
        else
          echo "No latest file found"
          ls -la data/mtsac/
        fi
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action - Mt SAC"
        
        git add data/mtsac/
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          TIMESTAMP=$(date -u)
          git commit -m "Latest Mt SAC data: ${TIMESTAMP}"
          git push
        fi
