name: Collect Rio Hondo Course Details

on:
  workflow_dispatch:
    inputs:
      schedule_file:
        description: 'Specific schedule file to process (optional)'
        required: false
        type: string
      limit:
        description: 'Limit number of courses to process (for testing)'
        required: false
        type: number
      rate_limit:
        description: 'Seconds between requests (default: 1.5)'
        required: false
        type: number
        default: 1.5
      no_resume:
        description: 'Start fresh instead of resuming'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '26 3 * * *'

jobs:
  collect-details:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: yezz123/setup-uv@v4
      with:
        uv-version: "0.5.16"
    
    - name: Determine input schedule file (prioritize detailed file)
      run: |
        if [ "${{ github.event.inputs.schedule_file }}" != "" ]; then
          SCHEDULE_FILE="${{ github.event.inputs.schedule_file }}"
          echo "Using specified schedule file: $SCHEDULE_FILE"
        else
          # Check for existing detailed file first (for incremental updates)
          DETAILED_FILE=$(ls data/rio-hondo/schedule_detailed_*.json 2>/dev/null | head -1)
          BASIC_FILE=$(ls data/rio-hondo/schedule_*_latest.json 2>/dev/null | head -1)
          
          if [ -f "$DETAILED_FILE" ]; then
            SCHEDULE_FILE="$DETAILED_FILE"
            echo "✅ Using existing detailed file for incremental update: $SCHEDULE_FILE"
            # Create backup before modifying
            BACKUP_FILE="${DETAILED_FILE%.json}_backup_$(date +%Y%m%d_%H%M%S).json"
            cp "$DETAILED_FILE" "$BACKUP_FILE"
            echo "📄 Backup created: $BACKUP_FILE"
            echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          elif [ -f "$BASIC_FILE" ]; then
            SCHEDULE_FILE="$BASIC_FILE"
            echo "🆕 No detailed file found, starting fresh from basic schedule: $SCHEDULE_FILE"
          else
            echo "ERROR: No schedule data found. Run basic collection first."
            ls -la data/rio-hondo/ || echo "Directory does not exist"
            exit 1
          fi
        fi
        
        if [ ! -f "$SCHEDULE_FILE" ]; then
          echo "ERROR: Schedule file not found: $SCHEDULE_FILE"
          exit 1
        fi
        
        echo "SCHEDULE_FILE=$SCHEDULE_FILE" >> $GITHUB_ENV
        echo "📊 Schedule file details:"
        uv run cli.py info "$SCHEDULE_FILE" | head -10
    
    - name: Collect course details
      run: |
        chmod +x collect_rio_details.py
        
        CMD="uv run collect_rio_details.py"
        
        # Use the selected schedule file as input (detailed file for incremental, basic for fresh start)
        CMD="$CMD --input '$SCHEDULE_FILE'"
        
        if [ "${{ github.event.inputs.limit }}" != "" ]; then
          CMD="$CMD --limit ${{ github.event.inputs.limit }}"
        fi
        
        RATE_LIMIT="${{ github.event.inputs.rate_limit }}"
        if [ "$RATE_LIMIT" == "" ]; then
          RATE_LIMIT="1.5"
        fi
        CMD="$CMD --rate-limit $RATE_LIMIT"
        
        if [ "${{ github.event.inputs.no_resume }}" == "true" ]; then
          CMD="$CMD --no-resume"
        fi
        
        echo "Running: $CMD"
        eval $CMD
        
        rm -f data/.rio_detail_progress.json
        
        # Clean up old backup files (keep only last 3)
        if ls data/rio-hondo/schedule_detailed_*_backup_*.json 1> /dev/null 2>&1; then
          echo "🧹 Cleaning up old backup files..."
          ls -t data/rio-hondo/schedule_detailed_*_backup_*.json | tail -n +4 | xargs -r rm -f
        fi
    
    - name: Validate detailed data and check for data loss
      run: |
        # Look for the standardized detailed schedule file
        DETAILED_FILE="data/rio-hondo/schedule_detailed_202570.json"
        
        if [ -f "$DETAILED_FILE" ]; then
          echo "📋 Validating detailed schedule: $DETAILED_FILE"
          uv run cli.py validate "$DETAILED_FILE"
          echo "DETAILED_FILE=$DETAILED_FILE" >> $GITHUB_ENV
          
          # Check for data loss by comparing with backup if it exists
          if [ -n "$BACKUP_FILE" ] && [ -f "$BACKUP_FILE" ]; then
            echo "🔍 Checking for data loss..."
            
            BACKUP_DETAILS=$(jq '[.courses[] | select(has("detail_fetched_at"))] | length' "$BACKUP_FILE")
            CURRENT_DETAILS=$(jq '[.courses[] | select(has("detail_fetched_at"))] | length' "$DETAILED_FILE")
            
            echo "📊 Course details: $BACKUP_DETAILS (before) → $CURRENT_DETAILS (after)"
            
            if [ "$CURRENT_DETAILS" -lt "$BACKUP_DETAILS" ]; then
              echo "❌ ERROR: Data loss detected! Detail count decreased from $BACKUP_DETAILS to $CURRENT_DETAILS"
              echo "🔄 Restoring from backup..."
              cp "$BACKUP_FILE" "$DETAILED_FILE"
              echo "💾 Backup restored. Please investigate the issue."
              exit 1
            elif [ "$CURRENT_DETAILS" -gt "$BACKUP_DETAILS" ]; then
              ADDED=$((CURRENT_DETAILS - BACKUP_DETAILS))
              echo "✅ Success: Added $ADDED new course details"
            else
              echo "📍 No new details added this run"
            fi
          else
            echo "ℹ️  No backup file available for comparison"
          fi
        else
          echo "❌ ERROR: Detailed schedule file not found: $DETAILED_FILE"
          ls -la data/rio-hondo/
          exit 1
        fi
    
    - name: Generate simple report
      run: |
        echo "## Rio Hondo Detail Collection Report - $(date -u)" > data/detail_collection_report.md
        echo "" >> data/detail_collection_report.md
        
        if [ -f "$DETAILED_FILE" ]; then
          TOTAL_COURSES=$(jq '.courses | length' "$DETAILED_FILE")
          DETAILED_COURSES=$(jq '.metadata.courses_with_details // 0' "$DETAILED_FILE")
          RATE_LIMIT=$(jq -r '.metadata.detail_rate_limit // "Unknown"' "$DETAILED_FILE")
          
          echo "### Collection Summary" >> data/detail_collection_report.md
          echo "- **Total Courses**: $TOTAL_COURSES" >> data/detail_collection_report.md
          echo "- **Courses with Details**: $DETAILED_COURSES" >> data/detail_collection_report.md
          echo "- **Rate Limit**: $RATE_LIMIT seconds" >> data/detail_collection_report.md
          echo "" >> data/detail_collection_report.md
          echo "**Collection completed successfully!**" >> data/detail_collection_report.md
        else
          echo "No detailed file to report on" >> data/detail_collection_report.md
        fi
    
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add data/
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          if [ -f "$DETAILED_FILE" ]; then
            TOTAL=$(jq '.courses | length' "$DETAILED_FILE")
            DETAILED=$(jq '.metadata.courses_with_details // 0' "$DETAILED_FILE")
            PROCESSED_THIS_RUN=$(jq '.metadata.courses_processed_this_run // 0' "$DETAILED_FILE")
            STATS="${DETAILED}/${TOTAL} courses with details"
            
            if [ "$PROCESSED_THIS_RUN" -gt 0 ]; then
              COMMIT_MSG="Update Rio Hondo course details: ${STATS} (+${PROCESSED_THIS_RUN} processed this run)"
            else
              COMMIT_MSG="Update Rio Hondo course details: ${STATS}"
            fi
          else
            COMMIT_MSG="Rio Hondo detail collection failed"
          fi
          
          git commit -m "$COMMIT_MSG"
          git push
        fi
    
    - name: Summary
      if: success()
      run: |
        echo "✅ Rio Hondo detail collection completed successfully!"
        if [ -f "$DETAILED_FILE" ]; then
          echo "📁 Detailed schedule updated: $DETAILED_FILE"
          echo "📊 Collection report: data/detail_collection_report.md"
          
          TOTAL=$(jq '.courses | length' "$DETAILED_FILE")
          DETAILED=$(jq '.metadata.courses_with_details // 0' "$DETAILED_FILE")
          echo "📈 Current status: ${DETAILED}/${TOTAL} courses have detailed information"
        fi