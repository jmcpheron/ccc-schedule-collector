name: Collect Mt SAC Schedule

on:
  workflow_dispatch:
    inputs:
      term_code:
        description: 'Term code to collect (e.g., 202520 for Fall 2025)'
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Test step
      run: echo "Hello Mt SAC workflow"