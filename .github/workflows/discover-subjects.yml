name: Discover Subject Changes

on:
  workflow_dispatch:
    inputs:
      college:
        description: 'College to discover subjects for (e.g., rio-hondo, citrus, or all)'
        required: true
        default: 'all'
        type: string
      update:
        description: 'Update configs with discoveries'
        required: false
        default: false
        type: boolean
  schedule:
    # Run weekly on Sundays at 2 AM UTC to check for subject changes
    #- cron: '0 2 * * 0'
  workflow_run:
    workflows: ["Collect Rio Hondo Schedule", "Collect Citrus Schedule"]
    types:
      - completed

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: yezz123/setup-uv@v4
      with:
        uv-version: "0.5.16"
    
    - name: Make scripts executable
      run: |
        chmod +x discover_subjects.py
        chmod +x cli.py
    
    - name: Discover subjects for colleges
      id: discover
      run: |
        # Determine which colleges to check
        if [ "${{ github.event.inputs.college }}" = "all" ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          COLLEGES="rio-hondo citrus"
        else
          COLLEGES="${{ github.event.inputs.college }}"
        fi
        
        # Track if we found any changes
        echo "changes_found=false" >> $GITHUB_OUTPUT
        
        # Check each college
        for college in $COLLEGES; do
          echo "## Checking $college"
          
          # Run discovery (exit codes: 0=ok, 2=new subjects, 3=missing expected)
          if ./discover_subjects.py --college "$college" --output text; then
            echo "No subject changes for $college"
          else
            exit_code=$?
            if [ $exit_code -eq 2 ]; then
              echo "New subjects found for $college!"
              echo "changes_found=true" >> $GITHUB_OUTPUT
            elif [ $exit_code -eq 3 ]; then
              echo "Missing expected subjects for $college!"
              echo "changes_found=true" >> $GITHUB_OUTPUT
            fi
          fi
          
          echo ""
        done
    
    - name: Update configs if requested
      if: (github.event.inputs.update == 'true' || github.event_name == 'schedule') && steps.discover.outputs.changes_found == 'true'
      run: |
        # Determine which colleges to update
        if [ "${{ github.event.inputs.college }}" = "all" ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          COLLEGES="rio-hondo citrus"
        else
          COLLEGES="${{ github.event.inputs.college }}"
        fi
        
        # Update each college
        for college in $COLLEGES; do
          echo "Updating config for $college..."
          ./discover_subjects.py --college "$college" --update --quiet || true
        done
    
    - name: Generate discovery report
      if: steps.discover.outputs.changes_found == 'true'
      run: |
        # Create report file
        REPORT_FILE="subject_discovery_report.md"
        echo "# Subject Discovery Report" > $REPORT_FILE
        echo "" >> $REPORT_FILE
        echo "Generated: $(date -u)" >> $REPORT_FILE
        echo "" >> $REPORT_FILE
        
        # Add results for each college
        if [ "${{ github.event.inputs.college }}" = "all" ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          COLLEGES="rio-hondo citrus"
        else
          COLLEGES="${{ github.event.inputs.college }}"
        fi
        
        for college in $COLLEGES; do
          echo "## $college" >> $REPORT_FILE
          echo '```' >> $REPORT_FILE
          ./discover_subjects.py --college "$college" --output text >> $REPORT_FILE || true
          echo '```' >> $REPORT_FILE
          echo "" >> $REPORT_FILE
        done
        
        # Output report path for later steps
        echo "report_file=$REPORT_FILE" >> $GITHUB_ENV
    
    - name: Commit config updates
      if: (github.event.inputs.update == 'true' || github.event_name == 'schedule') && steps.discover.outputs.changes_found == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add updated configs
        git add collectors/*/config.json
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No config changes to commit"
        else
          git commit -m "Update subject lists from discovery
          
          Automated discovery found subject changes in collected data.
          This commit updates the subject lists in college configurations."
          
          git push
        fi
    
    - name: Create issue for manual review
      if: steps.discover.outputs.changes_found == 'true' && github.event_name == 'schedule'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportFile = process.env.report_file;
          let reportContent = '';
          
          if (reportFile && fs.existsSync(reportFile)) {
            reportContent = fs.readFileSync(reportFile, 'utf8');
          }
          
          const issueBody = `## Subject Changes Detected
          
          The automated subject discovery workflow has detected changes in college subject codes.
          
          ${reportContent}
          
          ### Actions Needed:
          1. Review the changes above
          2. If the changes look correct, configs have been automatically updated
          3. If any subjects should be moved between expected/optional categories, please update manually
          4. Close this issue when review is complete
          
          Workflow run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Subject changes detected in college schedules',
            body: issueBody,
            labels: ['subject-discovery', 'needs-review']
          });
    
    - name: Summary
      if: always()
      run: |
        echo "## Discovery Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.discover.outputs.changes_found }}" = "true" ]; then
          echo "✅ Subject changes detected!" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.update }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ Configs updated automatically" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Configs not updated (manual trigger without update flag)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "${{ env.report_file }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Discovery Report" >> $GITHUB_STEP_SUMMARY
            cat "${{ env.report_file }}" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "✅ No subject changes detected" >> $GITHUB_STEP_SUMMARY
        fi